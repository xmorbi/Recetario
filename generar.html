<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<title>Generador de páginas de recetas</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:20px;line-height:1.6;background:#fdf8f0;color:#2b2320}
  h1{color:#7a1b15;font-size:1.6rem}
  button{padding:14px 28px;font-size:16px;font-weight:600;cursor:pointer;background:#b03a2e;color:#fff;border:none;border-radius:8px}
  button:hover{background:#7a1b15}
  button:disabled{background:#999;cursor:not-allowed}
  #log{background:#fff;border:1px solid #e6d6c1;padding:16px;margin-top:20px;white-space:pre-wrap;font-family:monospace;font-size:13px;border-radius:8px;max-height:400px;overflow-y:auto}
</style>
</head>
<body>

<h1>Generador de páginas individuales</h1>
<p>Haz clic en el botón para descargar <strong>recetas.zip</strong>.</p>

<button id="btnGenerar">Generar recetas</button>
<div id="log">Esperando...</div>

<script src="jszip.min.js"></script>
<script src="recetas.js"></script>
<script>
var URL_BASE = 'https://recetariochileno.netlify.app';

var ICONS = {
  clock: '<svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  porciones: '<svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2v6a3 3 0 0 0 6 0V2"/><path d="M8 11v11"/><path d="M20 2c-2 3-3 6-3 9h3v11"/></svg>',
  dificultad: '<svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>',
  tecnica: '<svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>',
  imprimir: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>',
  chef: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/><line x1="6" y1="17" x2="18" y2="17"/></svg>'
};

function slugify(t) {
  return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function tiempoISO(t) {
  if (!t) return 'PT60M';
  var x = String(t).toLowerCase(), h = 0, m = 0;
  var hm = x.match(/(\d+)\s*h/), mm = x.match(/(\d+)\s*min/);
  if (hm) h = parseInt(hm[1], 10);
  if (mm) m = parseInt(mm[1], 10);
  if (h === 0 && m === 0) return 'PT60M';
  var s = 'PT';
  if (h > 0) s += h + 'H';
  if (m > 0) s += m + 'M';
  return s;
}
function catLegible(c) {
  var m = {'principales':'Plato principal','sopas':'Sopa','panes':'Pan','ensaladas':'Ensalada','dulces':'Postre'};
  return m[c] || 'Plato principal';
}

function crearPagina(r, i, total, todos) {
  var slug = slugify(r.titulo);
  var url = URL_BASE + '/recetas/' + slug + '.html';
  var img = (r.imagen && r.imagen.trim() !== '') ? URL_BASE + '/' + r.imagen.replace(/^\.\.\//,'') : URL_BASE + '/img/og-default.jpg';

  var schema = JSON.stringify({
    "@context":"https://schema.org/","@type":"Recipe","name":r.titulo,"image":[img],
    "author":{"@type":"Organization","name":"Recetario Chileno"},
    "datePublished":"2025-01-15",
    "description":"Receta tradicional chilena de " + r.titulo + ".",
    "recipeCuisine":"Chilena","recipeCategory":catLegible(r.categoria),
    "totalTime":tiempoISO(r.tiempo),"recipeYield":r.porciones || "4 porciones",
    "recipeIngredient":r.ingredientes || [],
    "recipeInstructions":(r.pasos || []).map(function(p, idx) {
      return {"@type":"HowToStep","position":idx+1,"text":p};
    })
  });
  var bread = JSON.stringify({
    "@context":"https://schema.org","@type":"BreadcrumbList",
    "itemListElement":[
      {"@type":"ListItem","position":1,"name":"Inicio","item":URL_BASE+"/index.html"},
      {"@type":"ListItem","position":2,"name":"Recetas","item":URL_BASE+"/recetario.html"},
      {"@type":"ListItem","position":3,"name":r.titulo,"item":url}
    ]
  });

  var recetaJSON = JSON.stringify({
    titulo: r.titulo,
    categoria: r.categoria || 'principales',
    ingredientes: r.ingredientes || [],
    pasos: r.pasos || []
  }).replace(/<\/script/g, '<\\/script');

  var ing = (r.ingredientes || []).map(function(x) {
    return '<li><label><input type="checkbox"><span>' + esc(x) + '</span></label></li>';
  }).join('');
  var pasos = (r.pasos || []).map(function(x) { return '<li>' + esc(x) + '</li>'; }).join('');
  var dato = r.dato ? '<p class="dato"><strong>Dato:</strong> ' + esc(r.dato) + '</p>' : '';

  var chips = '';
  if (r.tiempo) chips += '<span>' + ICONS.clock + esc(r.tiempo) + '</span>';
  if (r.porciones) chips += '<span>' + ICONS.porciones + esc(r.porciones) + '</span>';
  if (r.dificultad) chips += '<span>' + ICONS.dificultad + 'Dificultad: ' + esc(r.dificultad) + '</span>';
  if (r.tecnica) chips += '<span>' + ICONS.tecnica + esc(r.tecnica) + '</span>';

  var prev = i > 0 ? todos[i-1] : null;
  var next = i < total-1 ? todos[i+1] : null;
  var nav = '<nav class="receta-nav">';
  nav += prev ? '<a href="' + slugify(prev.titulo) + '.html" class="receta-nav-prev">&larr; ' + esc(prev.titulo) + '</a>' : '<span></span>';
  nav += '<a href="../recetario.html" class="receta-nav-index">Todas las recetas</a>';
  nav += next ? '<a href="' + slugify(next.titulo) + '.html" class="receta-nav-next">' + esc(next.titulo) + ' &rarr;</a>' : '<span></span>';
  nav += '</nav>';

  var rels = todos.filter(function(x, j) { return j !== i && x.categoria === r.categoria; }).slice(0,3);
  var relHTML = '';
  if (rels.length > 0) {
    relHTML = '<aside class="recetas-relacionadas"><h3>Recetas relacionadas</h3><ul>';
    rels.forEach(function(x) {
      relHTML += '<li><a href="' + slugify(x.titulo) + '.html">' + esc(x.titulo) + '</a></li>';
    });
    relHTML += '</ul></aside>';
  }

  var h = '<!DOCTYPE html><html lang="es-CL"><head>';
  h += '<meta charset="UTF-8">';
  h += '<!-- Google Tag Manager --><script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({\'gtm.start\':new Date().getTime(),event:\'gtm.js\'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!=\'dataLayer\'?\'&l=\'+l:\'\';j.async=true;j.src=\'https://www.googletagmanager.com/gtm.js?id=\'+i+dl;f.parentNode.insertBefore(j,f);})(window,document,\'script\',\'dataLayer\',\'GTM-KXH425KQ\');<\/script><!-- End Google Tag Manager -->';
  h += '<!-- Google tag (gtag.js) --><script async src="https://www.googletagmanager.com/gtag/js?id=G-PCNBDPPXXYP"><\/script><script>window.dataLayer = window.dataLayer || [];function gtag(){dataLayer.push(arguments);}gtag(\'js\', new Date());gtag(\'config\', \'G-PCNBDPPXXYP\');<\/script>';
  h += '<meta name="viewport" content="width=device-width,initial-scale=1">';
  h += '<title>' + esc(r.titulo) + ' | Recetario Chileno</title>';
  h += '<meta name="description" content="' + esc('Receta chilena de ' + r.titulo + '. Ingredientes y preparación paso a paso.') + '">';
  h += '<meta name="robots" content="index,follow">';
  h += '<link rel="canonical" href="' + url + '">';
  h += '<meta property="og:type" content="article">';
  h += '<meta property="og:title" content="' + esc(r.titulo) + ' | Recetario Chileno">';
  h += '<meta property="og:description" content="' + esc('Receta chilena de ' + r.titulo) + '">';
  h += '<meta property="og:image" content="' + img + '">';
  h += '<meta property="og:url" content="' + url + '">';
  h += '<meta property="og:locale" content="es_CL">';
  h += '<meta name="twitter:card" content="summary_large_image">';
  h += '<link rel="preconnect" href="https://fonts.googleapis.com">';
  h += '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>';
  h += '<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">';
  h += '<link rel="stylesheet" href="../estilos.css">';
  h += '<script type="application/ld+json">' + schema + '<\/script>';
  h += '<script type="application/ld+json">' + bread + '<\/script>';
  h += '</head><body>';
  h += '<!-- Google Tag Manager (noscript) --><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KXH425KQ" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript><!-- End Google Tag Manager (noscript) -->';
  h += '<div class="bandera"><i class="azul"></i><i class="blanco"></i><i class="rojo"></i></div>';

  h += '<header class="site-nav"><div class="site-nav-inner">';
  h += '<a href="../index.html" class="site-nav-logo" aria-label="Recetario Chileno — Inicio"><div class="marca-logo"><span class="estrella"></span></div><span class="marca-texto">Recetario Chileno</span></a>';
  h += '<button class="site-nav-toggle" aria-label="Abrir menú" aria-expanded="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>';
  h += '<nav class="site-nav-links" aria-label="Navegación principal">';
  h += '<form class="nav-search" action="../recetario.html" method="get" role="search">';
  h += '<svg class="nav-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
  h += '<input type="search" name="buscar" placeholder="Buscar receta…" aria-label="Buscar recetas" autocomplete="off">';
  h += '</form>';
  h += '<a href="../index.html">Inicio</a>';
  h += '<a href="../recetario.html" class="activo">Recetas</a>';
  h += '<a href="../guias.html">Guías</a>';
  h += '<a href="../sobre-mi.html">Sobre mí</a>';
  h += '<a href="../contacto.html">Contacto</a>';
  h += '</nav></div></header>';

  var catActual = r.categoria || 'principales';

  h += '<header class="hero-receta">';
  h += '<div class="hero-receta-inner">';
  h += '<nav class="breadcrumb"><a href="../index.html">Inicio</a> &rsaquo; <a href="../recetario.html">Recetas</a> &rsaquo; <span class="breadcrumb-current">' + esc(r.titulo) + '</span></nav>';
  h += '<h1>' + esc(r.titulo) + '</h1>';
  h += '<div class="meta">' + chips + '</div>';
  h += '<div class="controles-receta">';
  h += '<a href="../recetario.html" class="filtro ' + (catActual==='todas'?'activo':'') + '">Todas</a>';
  h += '<a href="../recetario.html?cat=principales" class="filtro ' + (catActual==='principales'?'activo':'') + '">Platos de fondo</a>';
  h += '<a href="../recetario.html?cat=sopas" class="filtro ' + (catActual==='sopas'?'activo':'') + '">Sopas y guisos</a>';
  h += '<a href="../recetario.html?cat=panes" class="filtro ' + (catActual==='panes'?'activo':'') + '">Masas y horneados</a>';
  h += '<a href="../recetario.html?cat=ensaladas" class="filtro ' + (catActual==='ensaladas'?'activo':'') + '">Ensaladas y picoteo</a>';
  h += '<a href="../recetario.html?cat=dulces" class="filtro ' + (catActual==='dulces'?'activo':'') + '">Dulces</a>';
  h += '</div>';
  h += '</div></header>';

  h += '<main class="receta-page">';
  h += '<div class="receta-acciones-top">';
  h += '<button type="button" class="btn-imprimir btn-imprimir-receta" onclick="window.print()" aria-label="Imprimir esta receta">' + ICONS.imprimir + '<span>Imprimir receta</span></button>';
  h += '<button type="button" class="btn-modo-cocina" aria-label="Abrir modo cocina">' + ICONS.chef + '<span>Modo cocina</span></button>';
  h += '</div>';
  h += '<article class="receta" data-cat="' + esc(r.categoria || 'principales') + '">';

  var bloqueImagen = '';
  if (r.imagen && r.imagen.trim() !== '') {
    bloqueImagen = '<img class="receta-img" src="../' + esc(r.imagen) + '" alt="' + esc(r.titulo) + '" loading="eager">';
  }
  h += bloqueImagen;

  h += '<div class="cuerpo">';
  h += '<div><h3>' + esc(r.tituloIngredientes || 'Ingredientes') + '</h3><ul class="ingredientes">' + ing + '</ul></div>';
  h += '<div><h3>Preparación</h3><ol class="preparacion">' + pasos + '</ol>' + dato + '</div>';
  h += '</div></article>';

  var msjWA = 'Mira esta receta de ' + r.titulo + ' en Recetario Chileno: ' + url;
  var linkWA = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(msjWA);

  h += '<div class="compartir-receta">';
  h += '<span>¿Te gustó esta receta?</span>';
  h += '<a href="' + linkWA + '" target="_blank" rel="noopener" class="btn-whatsapp">';
  h += '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>';
  h += 'Compartir por WhatsApp</a>';
  h += '</div>';

  h += relHTML;
  h += nav;
  h += '</main>';
  h += '<footer><div class="bandera"><i class="azul"></i><i class="blanco"></i><i class="rojo"></i></div><span class="footer-flag"></span>Recetario Chileno &middot; Hecho con cari&ntilde;o en Chile<nav class="footer-legal" aria-label="Enlaces legales"><a href="../sobre-mi.html">Sobre m&iacute;</a><span class="sep">&middot;</span><a href="../privacidad.html">Privacidad</a><span class="sep">&middot;</span><a href="../contacto.html">Contacto</a></nav></footer>';
  h += '<script type="application/json" id="receta-data">' + recetaJSON + '<\/script>';
  h += '<script src="../modo-cocina.js" defer><\/script>';
  h += '</body></html>';
  return h;
}

function generar() {
  var log = document.getElementById('log');
  var btn = document.getElementById('btnGenerar');
  btn.disabled = true;
  log.textContent = 'Iniciando...\n';

  if (typeof JSZip === 'undefined') {
    log.textContent += '\nNo se cargó JSZip.\n\nSOLUCIÓN:\n1. Descarga https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js\n2. Guárdalo como jszip.min.js en esta carpeta\n3. Recarga la página\n';
    btn.disabled = false;
    return;
  }
  log.textContent += 'OK: JSZip cargado\n';

  if (typeof RECETAS === 'undefined' || !Array.isArray(RECETAS)) {
    log.textContent += '\nNo se cargó recetas.js. Verifica que esté en la misma carpeta.\n';
    btn.disabled = false;
    return;
  }
  log.textContent += 'OK: ' + RECETAS.length + ' recetas\n\n';

  var zip = new JSZip();
  var carpeta = zip.folder('recetas');
  var total = RECETAS.length;

  RECETAS.forEach(function(r, i) {
    var slug = slugify(r.titulo);
    carpeta.file(slug + '.html', crearPagina(r, i, total, RECETAS));
    log.textContent += 'OK ' + (i+1) + '/' + total + '  ' + slug + '.html\n';
  });

  log.textContent += '\nEmpaquetando ZIP...\n';
  zip.generateAsync({ type: 'blob' }).then(function(blob) {
    log.textContent += 'OK: ZIP (' + Math.round(blob.size/1024) + ' KB)\n\n';
    var u = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = u; a.download = 'recetas.zip';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(u); }, 1000);
    log.textContent += 'LISTO. Se descargó recetas.zip\n\nSIGUIENTE:\n1. Extrae la carpeta "recetas" dentro de Intento 2/ (reemplaza la existente)\n2. git add .\n3. git commit -m "F4: modo cocina"\n4. git pull --rebase\n5. git push\n';
    btn.disabled = false;
  }).catch(function(err) {
    log.textContent += '\nERROR: ' + err.message + '\n';
    btn.disabled = false;
  });
}

document.getElementById('btnGenerar').addEventListener('click', generar);
</script>

</body>
</html>
