height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div class="bandera"><i class="azul"></i><i class="blanco"></i><i class="rojo"></i></div>

<header class="hero-receta">
  <!-- Nuevo Encabezado de Marca -->
  <a href="index.html" class="header-marca">
    <div class="marca-logo"><span class="estrella"></span></div>
    <span class="marca-texto">Recetario Chileno</span>
  </a>
  
  <div class="hero-receta-inner">
    <h1>Todas las recetas</h1>
  </div>
</header>

<div class="controles">
  <div class="inner">
    <div class="buscador-wrap">
      <svg class="lupa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="buscador" autocomplete="off" placeholder="Buscar por receta o ingrediente… (ej: choclo, azucar)">
      <button class="limpiar" id="limpiarBuscador" hidden title="Limpiar búsqueda" aria-label="Limpiar búsqueda">×</button>
    </div>
    <button class="filtro activo" data-cat="todas">Todas</button>
    <button class="filtro" data-cat="principales">Platos de fondo</button>
    <button class="filtro" data-cat="sopas">Sopas y guisos</button>
    <button class="filtro" data-cat="panes">Masas y panes</button>
    <button class="filtro" data-cat="ensaladas">Ensaladas</button>
    <button class="filtro" data-cat="dulces">Dulces</button>
  </div>
</div>

<main>
  <p class="contador" id="contador" aria-live="polite"></p>
  <div id="contenedorRecetas"></div>
  <p class="vacio" id="sinResultados" hidden>
    No encontramos recetas con ese criterio.<br>
    <button class="btn-limpiar" id="limpiarVacio">Ver todas las recetas</button>
  </p>
</main>

<footer>
  <div class="bandera"><i class="azul"></i><i class="blanco"></i><i class="rojo"></i></div>

    <a href="privacidad.html">Privacidad</a><span class="sep">·</span>
    <a href="contacto.html">Contacto</a>
  </nav>
</footer>

<script src="recetas.js"></script>
<script src="app.js"></script>

</body>
</html>
