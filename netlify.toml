# ==========================================
# netlify.toml — Recetario Chileno
# ==========================================
#
# Redirects 301: URLs viejas .html → nuevas URLs limpias con trailing slash.
#
# ⚠️ Cada redirect asume que el .astro correspondiente YA está deployado.
# El commit que crea los .astro debe incluir este netlify.toml.

# ✅ privacidad.html → privacidad.astro (Fase 6)
[[redirects]]
  from = "/privacidad.html"
  to = "/privacidad/"
  status = 301
  force = true

# ✅ sobre-mi.html → sobre-mi.astro (Fase 7c)
[[redirects]]
  from = "/sobre-mi.html"
  to = "/sobre-mi/"
  status = 301
  force = true

# ✅ contacto.html → contacto.astro (Fase 7d)
[[redirects]]
  from = "/contacto.html"
  to = "/contacto/"
  status = 301
  force = true

# ✅ gracias.html → gracias.astro (Fase 7e)
# Nota: el form de contacto ahora postea a /gracias/ (no /gracias.html),
# así que este redirect solo cubre hits directos de viejos backlinks.
# Los POST de Netlify Forms van a /gracias/ y no se ven afectados.
[[redirects]]
  from = "/gracias.html"
  to = "/gracias/"
  status = 301
  force = true

# ==========================================
# Mejora 5: Redirecciones 301 por cambio de slugs con "ñ" o espacios
# ==========================================

[[redirects]]
  from = "/recetas/arroz-a-la-espa%C3%B1ola/"
  to = "/recetas/arroz-a-la-espanola/"
  status = 301
  force = true

[[redirects]]
  from = "/recetas/tortilla-de-champi%C3%B1ones/"
  to = "/recetas/tortilla-de-champinones/"
  status = 301
  force = true

# Pavo 1: al horno con mantequilla
[[redirects]]
  from = "/recetas/Pavo%20navide%C3%B1o%20al%20horno%20con%20mantequilla%20de%20hierbas/"
  to = "/recetas/pavo-navideno-al-horno-con-mantequilla-de-hierbas/"
  status = 301
  force = true

# Pavo 2: relleno con ciruelas y castañas
[[redirects]]
  from = "/recetas/Pavo%20navide%C3%B1o%20relleno%20con%20ciruelas%20y%20casta%C3%B1as/"
  to = "/recetas/pavo-navideno-relleno-con-ciruelas-y-castanas/"
  status = 301
  force = true

# Pavo 3: El redirect viejo que estaba roto (por si alguien guardó ese enlace)
[[redirects]]
  from = "/recetas/pavo-navide%C3%B1o/"
  to = "/recetas/pavo-navideno-relleno-con-ciruelas-y-castanas/"
  status = 301
  force = true

# ==========================================
# Fallback 404 (Debe ir siempre al final)
# ==========================================
# ✅ Mejora 3: Fallback para la página 404 de Astro
# Como build.format es 'directory', Astro genera /404/index.html.
# Esta regla le dice a Netlify que lo use para cualquier ruta no encontrada.
[[redirects]]
  from = "/*"
  to = "/404/"
  status = 404