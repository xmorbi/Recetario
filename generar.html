function slugify(t) {
  return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function tiempoISO(t) {
  if (!t) return 'PT60M';
  var x = String(t).toLowerCase(), h = 0, m = 0;
  var hm = x.match(/(\d+)\s*h/), mm = x.match(/(\d+)\s*min/);
  if (hm) h = parseInt(hm[1], 10);
  if (mm) m = parseInt(mm[1], 10);
  if (h === 0 && m === 0) return 'PT60M';
  var s = 'PT';
  if (h > 0) s += h + 'H';
  if (m > 0) s += m + 'M';
  return s;
}
function catLegible(c) {
  var m = {'principales':'Plato principal','sopas':'Sopa','panes':'Pan','ensaladas':'Ensalada','dulces':'Postre','bebidas':'Bebida'};
  return m[c] || 'Plato principal';
}

function generar() {
  var log = document.getElementById('log');
  var btn = document.getElementById('btnGenerar');
  btn.disabled = true;
  log.textContent = 'Iniciando...\n';

  if (typeof JSZip === 'undefined') {
    log.textContent += '\nNo se cargó JSZip.\n\nSOLUCIÓN:\n1. Descarga https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js\n2. Guárdalo como jszip.min.js en esta carpeta\n3. Recarga la página\n';
    btn.disabled = false;
    return;
  }
  log.textContent += 'OK: JSZip cargado\n';

  if (typeof RECETAS === 'undefined' || !Array.isArray(RECETAS)) {
    log.textContent += '\nNo se cargó recetas.js. Verifica que esté en la misma carpeta.\n';
    btn.disabled = false;
    return;
  }
  log.textContent += 'OK: ' + RECETAS.length + ' recetas\n\n';

  var zip = new JSZip();
  var carpeta = zip.folder('recetas');
  var total = RECETAS.length;

  RECETAS.forEach(function(r, i) {
    var slug = slugify(r.titulo);
    carpeta.file(slug + '.html', crearPagina(r, i, total, RECETAS));
    log.textContent += 'OK ' + (i+1) + '/' + total + '  ' + slug + '.html\n';
  });

  log.textContent += '\nEmpaquetando ZIP...\n';
  zip.generateAsync({ type: 'blob' }).then(function(blob) {
    log.textContent += 'OK: ZIP (' + Math.round(blob.size/1024) + ' KB)\n\n';
    var u = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = u; a.download = 'recetas.zip';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(u); }, 1000);
    log.textContent += 'LISTO. Se descargó recetas.zip\n\nSIGUIENTE:\n1. Extrae la carpeta "recetas" dentro de la raíz\n2. git add .\n3. git commit -m "nav.js en recetas + fix add-all"\n4. git push\n';
    btn.disabled = false;
  }).catch(function(err) {
    log.textContent += '\nERROR: ' + err.message + '\n';
    btn.disabled = false;
  });
}

document.getElementById('btnGenerar').addEventListener('click', generar);
