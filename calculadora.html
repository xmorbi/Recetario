<title>Calculadora de Porciones | Recetario Chileno</title>
<meta name="description" content="Calcula cuánta carne, arroz o papas necesitas por persona para tus recetas y asados. Evita desperdicios y cocina la cantidad exacta.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://recetariochileno.netlify.app/calculadora.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>
  /* Estilos específicos para la calculadora */
  .calc-container { max-width: 600px; margin: 2rem auto; padding: 2rem; background: #fff; border-radius: var(--radio); box-shadow: var(--sombra-md); border: 1px solid var(--borde); }
  .calc-group { margin-bottom: 1.5rem; }
  .calc-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--rojo-osc); }
  .calc-group select, .calc-group input { width: 100%; padding: 0.8rem; border: 2px solid var(--borde); border-radius: 8px; font-size: 1rem; font-family: inherit; background: var(--crema); color: var(--tinta); outline: none; transition: border-color 0.2s; }
  .calc-group select:focus, .calc-group input:focus { border-color: var(--rojo); background: #fff; }
  .calc-result { background: var(--crema-osc); padding: 2rem 1.5rem; border-radius: var(--radio); text-align: center; margin-top: 2rem; border-left: 4px solid var(--dorado); }
  .calc-result-label { font-size: 0.85rem; color: var(--suave); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; margin-bottom: 0.5rem; }
  .calc-result-number { font-size: 3rem; font-family: var(--fuente-titulos); font-weight: 900; color: var(--rojo-osc); line-height: 1; }
  .calc-note { font-size: 0.9rem; color: var(--suave); margin-top: 1rem; font-style: italic; }
</style>
</head>
<body>
<div class="bandera"><i class="azul"></i><i class="blanco"></i><i class="rojo"></i></div>

<!-- Menú principal -->
<header class="site-nav">
  <div class="site-nav-inner">
    <a href="index.html" class="site-nav-logo" aria-label="Recetario Chileno — Inicio">
      <div class="marca-logo"><span class="estrella"></span></div>
      <span class="marca-texto">Recetario Chileno</span>
    </a>
    <button class="site-nav-toggle" aria-label="Abrir menú" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <nav class="site-nav-links" aria-label="Navegación principal">
      <form class="nav-search" action="recetario.html" method="get" role="search">
        <svg class="nav-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" name="buscar" placeholder="Buscar receta…" aria-label="Buscar recetas" autocomplete="off">
      </form>
      <a href="index.html">Inicio</a>
      <a href="recetario.html">Recetas</a>
      <a href="guias.html">Guías</a>
      <a href="calculadora.html" class="activo">Calculadora</a>
      <a href="mis-recetas.html">Mis recetas</a>
      <a href="sobre-mi.html">Sobre nosotros</a>
    </nav>
  </div>
</header>

<header class="hero-receta">
  <div class="hero-receta-inner">
    <nav class="breadcrumb" aria-label="Migas de pan">
      <a href="index.html">Inicio</a> <span>›</span> <span class="breadcrumb-current">Calculadora</span>
    </nav>
    <h1>Calculadora de Porciones</h1>
    <p class="sub" style="color:var(--suave); font-style:italic; margin-top:1rem;">Ingredientes precisos para tus recetas, sin desperdicios.</p>
  </div>
</header>

<main class="legal-page">
  <div class="calc-container">
    <div class="calc-group">
      <label for="ingrediente">¿Qué vas a cocinar?</label>
      <select id="ingrediente">
        <option value="carne">Carne (Asado, parrillada)</option>
        <option value="arroz">Arroz (Crudo)</option>
        <option value="papa">Papa (Cruda)</option>
        <option value="pasta">Pasta (Cruda)</option>
      </select>
    </div>
    
    <div class="calc-group">
      <label for="personas">Número de comensales (adultos)</label>
      <input type="number" id="personas" value="4" min="1" max="50">
    </div>

    <div class="calc-result">
      <div class="calc-result-label">Cantidad recomendada</div>
      <div class="calc-result-number" id="resultado">---</div>
      <div class="calc-note" id="nota"></div>
    </div>
  </div>
</main>

<footer>

  </nav>
</footer>

<script src="app.js"></script>
</body>
</html>
